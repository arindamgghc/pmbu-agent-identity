<rect x="680" y="285" width="530" height="160" rx="14" fill="#e2f5ef" stroke="#238571" stroke-width="2"/>
<text x="700" y="319" font-family="Arial, sans-serif" font-size="22" fill="#16324b" font-weight="700"><tspan x="700" dy="0">Agent registry and accountable owner</tspan></text>
<text x="700" y="350" font-family="Arial, sans-serif" font-size="18" fill="#16324b" font-weight="400"><tspan x="700" dy="0">Administrator assigns profile and device</tspan><tspan x="700" dy="25.2">Single-use bootstrap: ≤ 5 minutes</tspan><tspan x="700" dy="25.2">Duo / enterprise approval: future adapter</tspan></text>
<rect x="680" y="490" width="530" height="145" rx="14" fill="#e2f5ef" stroke="#238571" stroke-width="2"/>
<text x="700" y="524" font-family="Arial, sans-serif" font-size="22" fill="#16324b" font-weight="700"><tspan x="700" dy="0">Temporary runtime identity</tspan></text>
<text x="700" y="555" font-family="Arial, sans-serif" font-size="18" fill="#16324b" font-weight="400"><tspan x="700" dy="0">Ed25519 JWT · SPIFFE-shaped instance ID</tspan><tspan x="700" dy="25.2">Issue / renew / end · TTL ≤ 10 minutes</tspan><tspan x="700" dy="25.2">SPIRE attestation + real SVID: future adapter</tspan></text>
<rect x="680" y="680" width="530" height="140" rx="14" fill="#e2f5ef" stroke="#238571" stroke-width="2"/>
<text x="700" y="714" font-family="Arial, sans-serif" font-size="22" fill="#16324b" font-weight="700"><tspan x="700" dy="0">Activity authorization and policy</tspan></text>
<text x="700" y="745" font-family="Arial, sans-serif" font-size="18" fill="#16324b" font-weight="400"><tspan x="700" dy="0">Identity + operation + flow + context</tspan><tspan x="700" dy="25.2">Activity TTL ≤ 2 minutes, parent-bounded</tspan><tspan x="700" dy="25.2">Profile rules assign class; revocation is online</tspan></text>
<rect x="1360" y="285" width="550" height="185" rx="14" fill="#e2f5ef" stroke="#238571" stroke-width="2"/>
<text x="1380" y="319" font-family="Arial, sans-serif" font-size="22" fill="#16324b" font-weight="700"><tspan x="1380" dy="0">Online gateway authorization</tspan></text>
<text x="1380" y="350" font-family="Arial, sans-serif" font-size="18" fill="#16324b" font-weight="400"><tspan x="1380" dy="0">Verify activity token, expiry and lifecycle</tspan><tspan x="1380" dy="25.2">Match flow ID and network context</tspan><tspan x="1380" dy="25.2">Reevaluate current policy at enforcement</tspan><tspan x="1380" dy="25.2">Local HTTP gateway + application scheduler</tspan></text>
<rect x="1360" y="570" width="550" height="250" rx="14" fill="#fff4df" stroke="#b78228" stroke-width="2"/>
<text x="1380" y="604" font-family="Arial, sans-serif" font-size="22" fill="#16324b" font-weight="700"><tspan x="1380" dy="0">Deployment-specific enforcement</tspan></text>
<text x="1380" y="635" font-family="Arial, sans-serif" font-size="18" fill="#16324b" font-weight="400"><tspan x="1380" dy="0">Access / cellular → PCF adapter + core QoS</tspan><tspan x="1380" dy="25.2">Edge DC → proxy / host / fabric queues</tspan><tspan x="1380" dy="25.2">Enterprise → branch / central QoS queues</tspan><tspan x="1380" dy="25.2"></tspan><tspan x="1380" dy="25.2">Planned: real packet / network treatment</tspan><tspan x="1380" dy="25.2">DSCP is intent; no automatic 5QI mapping</tspan></text>
