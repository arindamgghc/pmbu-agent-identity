<text x="60" y="1170" font-family="Arial, sans-serif" font-size="19" fill="#60778b" font-weight="400"><tspan x="60" dy="0">Implemented: local authorization and application queue ordering. Live Duo, SPIRE and network QoS remain integration work.</tspan></text>
<text x="60" y="1202" font-family="Arial, sans-serif" font-size="19" fill="#60778b" font-weight="400"><tspan x="60" dy="0">Tokens are bearer credentials. Alert intent is authorized, not clinically validated. Lab access is pending teammate provisioning.</tspan></text>
