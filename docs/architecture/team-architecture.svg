<text x="60" y="150" font-family="Arial, sans-serif" font-size="18" fill="#60778b" font-weight="400"><tspan x="60" dy="0">TEAL = working local prototype     AMBER = planned integration     BLUE = supplied lab infrastructure</tspan></text>
<text x="562" y="480" font-family="Arial, sans-serif" font-size="14" fill="#7759ac" font-weight="400"><tspan x="562" dy="0">1. Identity</tspan></text>
