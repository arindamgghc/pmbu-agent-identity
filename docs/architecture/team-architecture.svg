<text x="110" y="319" font-family="Arial, sans-serif" font-size="22" fill="#16324b" font-weight="700"><tspan x="110" dy="0">Activity changes importance</tspan></text>
<text x="110" y="350" font-family="Arial, sans-serif" font-size="18" fill="#16324b" font-weight="400"><tspan x="110" dy="0">Health: model update → background</tspan><tspan x="110" dy="25.2">Health: synthetic alert → critical</tspan><tspan x="110" dy="25.2">Travel: booking → interactive</tspan><tspan x="110" dy="25.2">Recipe: recipe fetch → background</tspan></text>
