<text x="110" y="605" font-family="Arial, sans-serif" font-size="18" fill="#16324b" font-weight="400"><tspan x="110" dy="0">Proxy / sidecar or OS flow association</tspan><tspan x="110" dy="25.2">Bind agent identity to observed traffic</tspan><tspan x="110" dy="25.2">Planned; flowId is a logical label today</tspan></text>
